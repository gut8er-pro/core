name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json — do not set
      # `version` here, action-setup errors on having both.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm biome check --diagnostic-level=error

      - name: Unit tests
        run: pnpm vitest run

      - name: Build
        run: pnpm build
